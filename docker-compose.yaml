networks:
  todoapp_net:
    name: todoapp_net
    driver: bridge
services:
  todoapp_db:
    container_name: todoapp_db
    image: mysql:8.0
    ports:
      - "8000:8000"
      - "8001-3306"
    volumes:
      - todoapp_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=app_db
      - MYSQL_USER=app_user
      - MYSQL_PASSWORD=1234
    networks:
      - todoapp_net
  todoapp:
    container_name: todoapp
    image: todoapp:2.0.1
    build:
      context: .
      args:
        - PYTHON_VERSION:3.9
    ports:
      - "8002:8080"
    networks:
      - todoapp_net
    depends_on:
      - todoapp_db
    restart: unless-stopped
volumes:
  todoapp_data:
    name: todoapp_data
